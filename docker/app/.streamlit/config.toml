[theme]
base = "light"
primaryColor = "#2A78D6"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#EDF1F5"
textColor = "#14213D"

[server]
headless = true
maxUploadSize = 5            # MB — a 10,000-row CSV is about 1.4 MB
enableXsrfProtection = true

[browser]
gatherUsageStats = false     # no usage data sent to Streamlit
serverAddress = "localhost"  # only changes the printed URL; avoids an outside lookup of the public IP

[client]
toolbarMode = "viewer"
