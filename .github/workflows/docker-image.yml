name: Docker image

# 1) build-and-test: builds the real image from docker/ and checks it the way a user would run it.
# 2) publish (main branch only, after the tests pass): builds it for Intel/AMD and Apple-silicon machines
#    and publishes it to GitHub Container Registry as ghcr.io/ar-base/churn-risk-desk.
on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker-image.yml"]
  pull_request:
    paths: ["docker/**", ".github/workflows/docker-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint < docker/Dockerfile

      - name: Build the image (runs selftest.py inside; fails if the model does not reproduce the notebook)
        run: docker build -t churn-risk-desk:ci docker

      - name: Start the container and wait until Docker reports it healthy
        run: |
          docker run -d --name desk -p 8501:8501 -p 8000:8000 churn-risk-desk:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' desk)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' desk)" = true ] || break
            sleep 5
          done
          exit 1

      - name: Smoke-test the API and the website
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/model | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['name'], 'v' + d['version'], d['config'])"
          python3 - <<'EOF'
          import json, urllib.request
          info = json.load(open("docker/app/model/model_info.json"))
          case = info["selftest"]
          body = json.dumps({"customer": case["customers"][0]}).encode()
          req = urllib.request.Request("http://localhost:8000/predict", body, {"Content-Type": "application/json"})
          got = json.load(urllib.request.urlopen(req))["churn_probability"]
          want = round(case["probabilities"][0], 4)
          print("predict:", got, "expected:", want)
          assert abs(got - want) < 1e-4
          bad = json.dumps({"customer": {**case["customers"][0], "Contract": "Lifetime"}}).encode()
          try:
              urllib.request.urlopen(urllib.request.Request("http://localhost:8000/predict", bad, {"Content-Type": "application/json"}))
              raise SystemExit("invalid input was accepted")
          except urllib.error.HTTPError as e:
              assert e.code == 422, e.code
              print("invalid input rejected with 422")
          EOF
          curl -fsS http://localhost:8501/_stcore/health && echo " website ok"
          [ "$(docker exec desk id -u)" = 10001 ] && echo "runs as non-root user 10001"

      - name: Stop cleanly (as `docker stop` does)
        run: |
          docker stop -t 20 desk
          code=$(docker inspect -f '{{.State.ExitCode}}' desk)
          echo "exit code: $code"
          [ "$code" = 0 ]

      - name: Container logs
        if: always()
        run: docker logs desk || true

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # lets the built-in GITHUB_TOKEN publish to ghcr.io; no personal token needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # emulates arm64 so the Apple-silicon image can be built here
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ar-base/churn-risk-desk
          tags: |
            type=raw,value=1.0
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/AR-base/telco-churn-mlops
            org.opencontainers.image.title=Churn risk desk

      - name: Build for amd64 + arm64 and push (selftest.py runs inside both builds)
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          pull: true                              # always start from the latest patched python:3.x-slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
